name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-build-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate data
        run: make validate

      - name: Build site and feed
        run: make build

      - name: Committed docs match build output
        run: |
          git diff --exit-code docs/ || (
            echo "::error::docs/ is out of date. Run 'make build' and commit docs/index.html and docs/feed.json."
            git diff --stat docs/
            exit 1
          )
